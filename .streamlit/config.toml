# Streamlit runtime configuration: analytics opt-out and brand theme.
# Colours are generated from src/sentinel/frontend/tokens.py — change the tokens,
# not this file, then re-run: uv run python -c "from sentinel.frontend.theme import
# theme_config_toml; print(theme_config_toml())"
[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#6FA0B8"
backgroundColor = "#0E1116"
secondaryBackgroundColor = "#1E242D"
textColor = "#E6E9EE"
baseRadius = "4px"

# Streamlit Cloud runs the repository-root `streamlit_app.py` directly; it does
# not invoke `uv run` and does not install the project itself, so that shim puts
# `src/` on sys.path.
# 4,899 real windows cross a websocket in the Dataset-shape payload, which is far
# larger than the 200 MB Streamlit's default per-message cap was tuned for.
[server]
maxMessageSize = 250
