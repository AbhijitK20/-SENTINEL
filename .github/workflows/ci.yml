name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run python scripts/check_reachability.py --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --all-groups
      # `-o addopts="-q"` clears the ini default that deselects performance tests.
      - run: uv run pytest -o addopts="-q"
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run bandit -r src/sentinel --skip B101 --severity-level medium

  release:
    # The committed bundle is what a reviewer and a deployment both load. If it
    # stops matching its own manifest, every claim in the README is unsupported,
    # and that must fail the build rather than surface during a demo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - run: uv sync --all-extras
      - run: uv run python scripts/verify_release_artifacts.py models/release/v1

  golden-path:
    # The demo is also the smoke test: it loads the committed artifacts and runs
    # the product's central path end to end, so a break in scoring, explaining,
    # detection or imagination fails here instead of on stage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - run: uv sync --all-extras
      - run: uv run python scripts/demo_script.py
      - name: smoke the backtest on a short scenario list
        run: uv run python scripts/run_backtest.py --origins 2 --scenarios 10

  claims:
    # Every figure in docs/CLAIMS.md has to have been printed by a script. The
    # benchmark has to run first, because a number that appears in no report is
    # exactly the case this is here to catch - an audit with no reports trivially
    # passes everything, which is how the first version of this job was useless.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - run: uv sync --all-extras
      - name: produce the reports the claims refer to
        run: |
          uv run python scripts/run_benchmark.py --output reports/generated/benchmark
          uv run python scripts/run_backtest.py --output reports/generated/benchmark/backtest
          uv run python scripts/run_detector_benchmark.py --output reports/generated/benchmark/detectors
          uv run python scripts/run_calibration_report.py --output reports/generated/benchmark/calibration
          uv run python scripts/run_telemetry_budget.py --output reports/generated/benchmark/telemetry
          uv run python scripts/run_evasion_report.py --output reports/generated/benchmark/evasion
          uv run python scripts/run_label_efficiency.py --output reports/generated/benchmark/label-efficiency
          uv run python scripts/run_drift_report.py --output reports/generated/benchmark/drift
      - name: audit docs/CLAIMS.md against them
        run: uv run python scripts/check_claims.py
