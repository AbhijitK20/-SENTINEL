name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - run: uv run pytest -q --ignore=tests/test_api.py --ignore=tests/test_auth.py --ignore=tests/test_enterprise.py --ignore=tests/test_threat_intel.py --ignore=tests/test_optional_deps.py

  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run pytest -q --ignore=tests/test_api.py --ignore=tests/test_auth.py --ignore=tests/test_enterprise.py --ignore=tests/test_threat_intel.py --ignore=tests/test_optional_deps.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run pip-audit || true
