# Local pilot compose: dashboard + REST API from one image, plus an optional
# observability stack (Prometheus + Grafana) under the `obs` profile.
# This is NOT the production architecture (Kubernetes, Kafka, Postgres) —
# those need real infrastructure decisions and stay in docs/ROADMAP.md.
services:
  dashboard:
    build: .
    image: ${SENTINEL_IMAGE:-sih26153-sentinel:local}
    pull_policy: build
    ports:
      - "8501:8501"
    environment:
      # Force Attack buttons run attack scripts against Idurar ERP.
      SENTINEL_DEMO_TARGET: http://idurar-target:8888
      SENTINEL_API_URL: http://api:8100
      # The recon phase opens real TCP sockets, so it needs the container
      # hostname — not the dashboard's own localhost.
      SENTINEL_TARGET_HOST: idurar-target
      SENTINEL_TARGET_PORT: "8888"
    volumes:
      - ./reports:/app/reports
      # Read-only dataset mount: CIC-IDS2017 stays on the host (never baked
      # into the image) while the dashboard's real-data mode can load it.
      - ./data:/app/data:ro
    networks: [default, lab-net]
    restart: unless-stopped

  api:
    image: ${SENTINEL_IMAGE:-sih26153-sentinel:local}
    build: .
    pull_policy: build
    command: ["uv", "run", "--no-sync", "uvicorn", "sentinel.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      SENTINEL_ARTIFACTS_DIR: /app/reports/generated/real-benchmark/baseline
      SENTINEL_THREAT_FEED_FILE: /app/reports/threat_intel/feed.json
      SENTINEL_BOOTSTRAP_KEY: ${SENTINEL_BOOTSTRAP_KEY:-sent_demo_key_2026}
    ports:
      - "8100:8100"
    volumes:
      - ./reports:/app/reports
    networks: [lab-net, default, demo-net]
    depends_on:
      feed-refresher:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot out-of-band refresh of the free URLhaus feed (offline-first: the
  # runtime itself never fetches; this container does, once, at compose up).
  # Re-run on a schedule with: docker compose run --rm feed-refresher
  feed-refresher:
    image: ${SENTINEL_IMAGE:-sih26153-sentinel:local}
    build: .
    pull_policy: build
    command: ["uv", "run", "--no-sync", "python", "scripts/fetch_threat_feed.py", "--out", "/app/reports/threat_intel/feed.json", "--max-age-hours", "12"]
    volumes:
      - ./reports:/app/reports
    restart: "no"

  lab-scenario-runner:
    image: ${SENTINEL_IMAGE:-sih26153-sentinel:local}
    build: .
    pull_policy: build
    command:
      - uv
      - run
      - --no-sync
      - python
      - scripts/run_lab_scenario.py
      - --scenario
      - recon-auth-progression
      - --manifest
      - /app/configs/lab/scenarios.json
      - --target
      - http://idurar-target:8888
      - --api
      - http://api:8100
    environment:
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:-}
    volumes:
      - ./configs/lab/scenarios.json:/app/configs/lab/scenarios.json:ro
    depends_on:
      - api
    restart: "no"
    profiles: ["lab"]
    networks: [lab-net]

  # Multi-phase attack: port scan → brute force → API enum → upload staging
  # against Idurar.  Produces 50+ events across 4 attack phases so SENTINEL's
  # detectors fire on real network telemetry.
  lab-attack-idurar:
    image: ${SENTINEL_IMAGE:-sih26153-sentinel:local}
    build: .
    pull_policy: build
    command:
      - uv
      - run
      - --no-sync
      - python
      - scripts/attack_idurar.py
      - --target
      - http://idurar-target:8888
      - --api
      - http://api:8100
      - --target-host
      - idurar-target
      - --target-port
      - "8888"
    environment:
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:-}
    depends_on:
      - api
      - idurar-target
    restart: "no"
    profiles: ["lab"]
    networks: [lab-net]

  # Full 9-phase attack suite: DDoS, recon, brute force, injection,
  # lateral movement, exfiltration, C2 beaconing, insider threat,
  # malware staging — 127+ events across all attack categories.
  lab-full-attack:
    image: ${SENTINEL_IMAGE:-sih26153-sentinel:local}
    build: .
    pull_policy: build
    command:
      - uv
      - run
      - --no-sync
      - python
      - scripts/full_attack.py
      - --target
      - http://idurar-target:8888
      - --api
      - http://api:8100
      - --target-host
      - idurar-target
      - --target-port
      - "8888"
    environment:
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:-}
    depends_on:
      - api
      - idurar-target
    restart: "no"
    profiles: ["lab"]
    networks: [lab-net]

  idurar-target:
    build:
      context: ../idurar-erp-crm/backend
      dockerfile: Dockerfile
    environment:
      DATABASE: mongodb://host.docker.internal:27017/idurar
      JWT_SECRET: ${IDURAR_JWT_SECRET:-sentinel-idurar-lab-secret}
      NODE_ENV: development
      OPENSSL_CONF: /dev/null
      PUBLIC_SERVER_FILE: http://idurar-target:8888/
    extra_hosts:
      - host.docker.internal:host-gateway
    expose:
      - "8888"
    networks: [lab-net]
    restart: unless-stopped
    profiles: ["lab"]

  idurar-frontend:
    build:
      context: ../idurar-erp-crm/frontend
      dockerfile: Dockerfile
    environment:
      VITE_PROXY_TARGET: http://idurar-target:8888/
    ports:
      - "3002:3002"
    depends_on:
      - idurar-target
    networks: [lab-net]
    restart: unless-stopped
    profiles: ["lab"]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    profiles: ["obs"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    profiles: ["obs"]

  # ── real-traffic demo (profile: realtime) ─────────────────────────────
  # demo-net carries all demo traffic. demo-sensor sniffs it (NET_RAW) and
  # streams every packet to the API's /v1/events push engine; demo-attacker
  # runs a real nmap SYN scan against demo-target. The recon detector fires
  # on the captured packets. All traffic stays inside the compose network —
  # nothing on the host or internet is scanned.
  demo-target:
    image: nginx:alpine
    networks: [demo-net]
    restart: unless-stopped
    profiles: ["realtime"]

  demo-attacker:
    image: instrumentisto/nmap:latest
    networks: [demo-net]
    cap_add: [NET_RAW]
    # instrumentisto/nmap ENTRYPOINT is `nmap` — override it to run a shell
    # script instead. Wait for the sensor's tcpdump to be armed, then run a
    # full SYN scan at polite timing so probe traffic spans window strides.
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 40
        nmap -sS -p 1-1024,3389,5985 -T2 --open demo-target || nmap -sT -p 1-1024,3389,5985 -T2 --open demo-target
    restart: "no"
    depends_on: [demo-target]
    profiles: ["realtime"]

  # Sniffs the TARGET's network namespace (the scan's victim sees every probe
  # and response; a bridge peer sees nothing unicast between other peers) and
  # streams FLOW events into SENTINEL. flow_sensor aggregates the 5-tuple
  # stream (SYN start, RST/FIN teardown, idle/max-age sweep) into one flow
  # event per connection — the exact event shape the trained forecaster was
  # fit on (CIC-IDS2017 flow records), so the MODEL scores the realtime path,
  # not just the rule-based detectors. Switch to scripts/packet_sensor.py to
  # push raw per-packet events instead. tcpdump installs via apt on first
  # start; NET_RAW is required to capture.
  demo-sensor:
    image: ${SENTINEL_IMAGE:-sih26153-sentinel:local}
    build: .
    pull_policy: build
    network_mode: "service:demo-target"
    cap_add: [NET_RAW]
    command:
      - sh
      - -c
      - |
        command -v tcpdump >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq tcpdump)
        exec tcpdump -l -n -tttt -i eth0 ip 2>/dev/null | uv run --no-sync python scripts/flow_sensor.py --api http://api:8100 --api-key "$${SENTINEL_API_KEY:-}"
    environment:
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:-}
    depends_on: [api]
    restart: unless-stopped
    profiles: ["realtime"]

  # ── demo: vulnerable app + attacks + admin dashboard ────────────────
  # REMOVED: demo-admin (port 5001) — was attacking vulnerable-app.
  # Use lab-full-attack or lab-attack-idurar to attack Idurar instead.
  # Run: docker compose --profile lab run --rm lab-full-attack
  vulnerable-app:
    build: apps/vulnerable
    image: sentinel-demo-app:local
    ports:
      - "5000:5000"
    volumes:
      - demo-logs:/logs
    environment:
      SENTINEL_ACCESS_LOG: /logs/access.log
      SENTINEL_BLOCKLIST: /logs/blocklist.jsonl
    restart: unless-stopped
    profiles: ["demo"]

  demo-sentinel:
    image: ${SENTINEL_IMAGE:-sih26153-sentinel:local}
    build: .
    pull_policy: build
    command:
      - python
      - apps/vulnerable/scanner.py
      - --api
      - http://api:8100
      - --log
      - /logs/access.log
    volumes:
      - demo-logs:/logs
    environment:
      SENTINEL_API_KEY: ${SENTINEL_BOOTSTRAP_KEY:-sent_demo_key_2026}
    depends_on: [api]
    restart: unless-stopped
    profiles: ["demo"]

networks:
  lab-net: {}
  demo-net:

volumes:
  demo-logs:
